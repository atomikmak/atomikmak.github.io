<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d1b3e;}
#app{
  font-family:'Rubik',sans-serif;direction:rtl;
  height:100vh;max-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:16px 8px 0;background:#0d1b3e;transition:background 2.5s;
}
.scene{display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:660px;position:relative;z-index:100;}
.half{flex:1;display:flex;flex-direction:column;align-items:center;overflow:visible;opacity:0;position:relative;}

.sky{
  width:100%;height:100px;position:relative;overflow:visible;
  background:transparent;
}
.sky.green-sky{background:transparent!important;}

.rooftop-items{
  width:100%;max-width:295px;
  height:0;position:relative;overflow:visible;
}

.building{
  width:100%;max-width:295px;background:#151929;
  border:1px solid #252a42;border-bottom:none;
  transform:scaleY(0);transform-origin:bottom;transition:border-color 2.5s;
  position:relative;z-index:50;
}
.building.green-bld{border-color:#1a4525!important;background:#0a1e0f!important;}
.floor{display:flex;padding:5px 4px;gap:2px;border-bottom:1px solid #0d1020;background:#161a2e;transition:background 2.5s;}
.floor.top{background:#111524;}
.floor.green-floor{background:#0c1e10!important;}
.floor.top.green-floor{background:#091508!important;}
.win{flex:1;height:13px;background:#090c18;border:1px solid #1e2340;border-radius:1px;transition:background 0.8s,box-shadow 0.8s;}
.win.half-lit{background:#2a2208;box-shadow:0 0 3px rgba(255,210,60,0.12);}
.win.full-lit{background:#ffe060;box-shadow:0 0 8px 2px rgba(255,224,80,0.7);}
.win.green-win{background:#0d3518!important;box-shadow:none!important;}
.win.half-lit.green-win{background:#0d3518!important;}
.win.full-lit.green-win{background:#22ee77!important;box-shadow:0 0 8px 2px rgba(34,238,120,0.6)!important;}

/* street */
.street-wrap{
  width:100%;max-width:660px;position:relative;
  height:60px;background:#080c18;border-top:2px solid #252a42;
  overflow:hidden;transition:background 2.5s;
  z-index:80;
}
.street-wrap.green-street{background:#040e08!important;border-top-color:#1a4525!important;}
.sidewalk{position:absolute;bottom:0;left:0;right:0;height:10px;background:#0e1228;border-top:1px solid #1a2040;}
.road-line{
  position:absolute;left:0;right:0;height:2px;bottom:26px;
  background:repeating-linear-gradient(to right,#1e2448 0,#1e2448 16px,transparent 16px,transparent 28px);
}
.lamppost{position:absolute;bottom:10px;width:3px;background:#1e2340;z-index:10;}
.lamppost::after{content:'';position:absolute;top:-3px;left:-5px;width:13px;height:3px;background:#1e2340;border-radius:2px;}
.lamppost::before{content:'';position:absolute;top:-8px;left:1px;width:5px;height:5px;border-radius:50%;background:#ffe8a0;box-shadow:0 0 6px 2px rgba(255,232,120,0.5);}

.divider{width:6px;height:380px;background:#0d1b3e;align-self:flex-end;flex-shrink:0;transition:background 2.5s;position:relative;z-index:50;}
.divider.green-div{background:#06150d!important;}

.controls{display:flex;gap:10px;width:100%;max-width:660px;margin-top:14px;opacity:1;transform:translateY(0);transition:opacity 0.6s,visibility 0.6s;visibility:visible;}
.controls.hidden{opacity:0;transform:translateY(12px);visibility:hidden;}
.panel{flex:1;background:#111524;border:1px solid #252a42;border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;}
.ptitle{text-align:center;font-size:13px;font-weight:600;color:#7a8ab0;letter-spacing:0.04em;margin-bottom:2px;}
.ctrl-row{display:flex;flex-direction:column;gap:3px;}
.clabel{font-size:11px;color:#5a6a90;font-weight:400;}
select{width:100%;background:#090c18;color:#c0d0ee;border:1px solid #2a3050;border-radius:5px;padding:5px 7px;font-size:12px;font-family:'Rubik',sans-serif;direction:rtl;appearance:none;cursor:pointer;}
select:focus{outline:none;border-color:#4455cc;}
select:hover{border-color:#3a4a88;}

.statusbar{display:flex;align-items:center;gap:10px;width:100%;max-width:660px;justify-content:center;margin-top:12px;opacity:1;transition:opacity 0.6s,visibility 0.6s;visibility:visible;}
.statusbar.hidden{opacity:0;visibility:hidden;}
.dot{width:9px;height:9px;border-radius:50%;background:#252a42;transition:background 0.6s,box-shadow 0.6s;flex-shrink:0;}
.stext{font-size:12px;color:#4a5580;text-align:center;transition:color 0.5s;font-family:'Rubik',sans-serif;}
.banner{display:none;text-align:center;font-size:16px;color:#33dd88;margin-top:10px;letter-spacing:0.1em;font-family:'Rubik',sans-serif;font-weight:600;}
.banner.show{display:block;animation:fadeUp 1s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* weather elements */
.weather-canvas{position:absolute;inset:0;pointer-events:none;}

.cloud-el{
  position:absolute;
  pointer-events:none;
  transition:none;
}

.sun-el{
  position:absolute;
  border-radius:50%;
  background:#FFD060;
  pointer-events:none;
}
  </style>
</head>
<body>
<div id="app">
  <div class="scene" id="scene">
    <div class="half" id="half-right">
      <div class="sky" id="sky-right" data-side="right"></div>
      <div class="rooftop-items" id="roof-right"></div>
      <div class="building" id="bld-right"></div>
    </div>
    <div class="divider" id="div-mid"></div>
    <div class="half" id="half-left">
      <div class="sky" id="sky-left" data-side="left"></div>
      <div class="rooftop-items" id="roof-left"></div>
      <div class="building" id="bld-left"></div>
    </div>
  </div>
  <div class="street-wrap" id="street">
    <div class="road-line"></div>
    <div class="sidewalk"></div>
    <div class="lamppost" style="left:18%;height:32px;"></div>
    <div class="lamppost" style="left:81%;height:32px;"></div>
  </div>
  <div class="controls" id="controls">
    <div class="panel">
      <div class="ptitle">רח׳ איינשטיין 4</div>
      <div class="ctrl-row"><div class="clabel">יום</div>
      <select id="dr" onchange="chk()">
        <option value="">— בחר —</option>
        <option value="sun">ראשון</option><option value="mon">שני</option>
        <option value="tue">שלישי</option><option value="wed">רביעי</option>
        <option value="thu">חמישי</option><option value="fri">שישי</option>
        <option value="sat">שבת</option>
      </select></div>
      <div class="ctrl-row"><div class="clabel">חודש</div>
      <select id="mr" onchange="chk()">
        <option value="">— בחר —</option>
        <option value="1">ינואר</option><option value="2">פברואר</option><option value="3">מרץ</option>
        <option value="4">אפריל</option><option value="5">מאי</option><option value="6">יוני</option>
        <option value="7">יולי</option><option value="8">אוגוסט</option><option value="9">ספטמבר</option>
        <option value="10">אוקטובר</option><option value="11">נובמבר</option><option value="12">דצמבר</option>
      </select></div>
      <div class="ctrl-row"><div class="clabel">מזג אוויר</div>
      <select id="wr" onchange="setW('right');chk()">
        <option value="">— בחר —</option>
        <option value="cloudy">מעונן</option><option value="sunny">שמשי</option><option value="rain">גשום</option>
      </select></div>
    </div>
    <div class="panel">
      <div class="ptitle">רח׳ איינשטיין 6</div>
      <div class="ctrl-row"><div class="clabel">יום</div>
      <select id="dl" onchange="chk()">
        <option value="">— בחר —</option>
        <option value="sun">ראשון</option><option value="mon">שני</option>
        <option value="tue">שלישי</option><option value="wed">רביעי</option>
        <option value="thu">חמישי</option><option value="fri">שישי</option>
        <option value="sat">שבת</option>
      </select></div>
      <div class="ctrl-row"><div class="clabel">חודש</div>
      <select id="ml" onchange="chk()">
        <option value="">— בחר —</option>
        <option value="1">ינואר</option><option value="2">פברואר</option><option value="3">מרץ</option>
        <option value="4">אפריל</option><option value="5">מאי</option><option value="6">יוני</option>
        <option value="7">יולי</option><option value="8">אוגוסט</option><option value="9">ספטמבר</option>
        <option value="10">אוקטובר</option><option value="11">נובמבר</option><option value="12">דצמבר</option>
      </select></div>
      <div class="ctrl-row"><div class="clabel">מזג אוויר</div>
      <select id="wl" onchange="setW('left');chk()">
        <option value="">— בחר —</option>
        <option value="cloudy">מעונן</option><option value="sunny">שמשי</option><option value="rain">גשום</option>
      </select></div>
    </div>
  </div>
  <div class="statusbar" id="sbar">
    <div class="dot" id="dot-r"></div>
    <div class="stext" id="stxt"></div>
    <div class="dot" id="dot-l"></div>
  </div>
  <div class="banner" id="banner">✦ תשובה נכונה! ✦</div>
</div>

<script>
(function(){
  const FLOORS=6,WINS=11;
  const rainAF={};
  const weatherState={right:'',left:''};

  // ── build roof (stair entry only) ──────────────────────────
  function buildRoof(side){
    const r=document.getElementById('roof-'+side);
    r.innerHTML='';
    const entry=document.createElement('div');
    entry.style.cssText=`position:absolute;bottom:0;${side==='right'?'right:40px':'left:40px'};width:32px;height:24px;background:#1e2240;border:1.5px solid #3a3e5e;border-bottom:none;`;
    const roofTop=document.createElement('div');
    roofTop.style.cssText='position:absolute;top:-4px;left:-3px;right:-3px;height:5px;background:#252a4e;border:1px solid #3a3e5e;';
    const door=document.createElement('div');
    door.style.cssText='position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:12px;height:15px;background:#0d1020;border:1px solid #2a2e4e;border-bottom:none;border-radius:1px 1px 0 0;';
    entry.appendChild(roofTop);entry.appendChild(door);
    r.appendChild(entry);
  }

  function buildSide(side){
    const b=document.getElementById('bld-'+side);
    b.innerHTML='';
    for(let f=0;f<FLOORS;f++){
      const row=document.createElement('div');
      row.className='floor'+(f===0?' top':'');
      for(let w=0;w<WINS;w++){
        const d=document.createElement('div');
        if(f===0){d.className=w===5?'win full-lit':'win half-lit';}
        else{d.className='win';}
        row.appendChild(d);
      }
      b.appendChild(row);
    }
  }

  buildRoof('right');buildRoof('left');
  buildSide('right');buildSide('left');

  // ── weather animations ─────────────────────────────────────
  function clearSky(side){
    const sky=document.getElementById('sky-'+side);
    if(rainAF[side]){cancelAnimationFrame(rainAF[side]);delete rainAF[side];}
    [...sky.children].forEach(function(c){
      c.style.transition='opacity 0.45s';
      c.style.opacity='0';
      setTimeout(function(){if(c.parentNode===sky)sky.removeChild(c);},480);
    });
  }

  function animateSunrise(sky){
    const size=34;
    const sun=document.createElement('div');
    sun.className='sun-el';
    // start half-submerged at bottom, rise to upper area
    const startY=sky.offsetHeight - size/2;
    const endY=22;
    sun.style.cssText='position:absolute;width:'+size+'px;height:'+size+'px;left:50%;margin-left:-'+(size/2)+'px;top:'+startY+'px;z-index:20;';
    sky.appendChild(sun);
    const duration=1500;
    const t0=performance.now();
    function step(now){
      const p=Math.min((now-t0)/duration,1);
      const ease=1-Math.pow(1-p,3);
      const y=startY+(endY-startY)*ease;
      const glow=Math.round(ease*24);
      sun.style.top=y+'px';
      sun.style.boxShadow='0 0 '+glow+'px '+Math.round(glow*0.35)+'px rgba(255,208,60,0.5),0 0 '+(glow*2)+'px '+glow+'px rgba(255,180,0,0.22)';
      if(p<1)requestAnimationFrame(step);
      else sun.style.animation='sunGlow2 3s ease-in-out infinite';
    }
    requestAnimationFrame(step);
  }

  function makeCloudSVG(dark,scale){
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('width','110');svg.setAttribute('height','55');
    const base=dark?'#1e2840':'#3d4d72';
    const light=dark?'#2a3555':'#4f6090';
    [[50,40,26,14,base],[28,40,17,10,base],[72,40,15,9,base],
     [50,28,20,12,light],[34,30,13,8,light],[64,30,12,7,light],[50,20,13,8,light]
    ].forEach(function(arr){
      const e=document.createElementNS(ns,'ellipse');
      e.setAttribute('cx',arr[0]);e.setAttribute('cy',arr[1]);
      e.setAttribute('rx',arr[2]);e.setAttribute('ry',arr[3]);
      e.setAttribute('fill',arr[4]);svg.appendChild(e);
    });
    return svg;
  }

  function animateClouds(sky,dark){
    const configs=[
      {xpct:50,targetY:20,delay:0,  scale:1,   zindex:3},
      {xpct:24,targetY:34,delay:220,scale:0.65, zindex:2},
      {xpct:76,targetY:30,delay:400,scale:0.58, zindex:2},
    ];
    configs.forEach(function(cfg){
      const svg=makeCloudSVG(dark,cfg.scale);
      const startY=-55;
      svg.style.cssText='position:absolute;left:'+cfg.xpct+'%;transform:translateX(-50%) scale('+cfg.scale+');transform-origin:top center;opacity:0;top:'+startY+'px;z-index:'+cfg.zindex+';';
      sky.appendChild(svg);
      setTimeout(function(){
        const duration=950;
        const t0=performance.now();
        function step(now){
          const p=Math.min((now-t0)/duration,1);
          const ease=1-Math.pow(1-p,2.5);
          svg.style.top=(startY+(cfg.targetY-startY)*ease)+'px';
          svg.style.opacity=(p*0.95)+'';
          if(p<1)requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      },cfg.delay);
    });
  }

  function animateRain(sky){
    animateClouds(sky,true);
    // clipping wrapper for canvas
    const clip=document.createElement('div');
    clip.style.cssText='position:absolute;inset:0;overflow:hidden;pointer-events:none;';
    const canvas=document.createElement('canvas');
    canvas.width=sky.offsetWidth||295;canvas.height=100;
    canvas.style.cssText='position:absolute;inset:0;opacity:0;';
    clip.appendChild(canvas);
    sky.appendChild(clip);
    const ctx=canvas.getContext('2d');
    const drops=Array.from({length:38},function(){
      return {x:Math.random()*canvas.width,y:Math.random()*100,len:4+Math.random()*9,speed:3+Math.random()*3,op:0.15+Math.random()*0.5};
    });
    let intensity=0;
    const t0=performance.now();
    const rainKey=sky.dataset.side;
    function frame(now){
      if(!rainAF[rainKey])return;
      intensity=Math.min((now-t0)/2500,1);
      canvas.style.opacity=intensity;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drops.forEach(function(d){
        ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-1.3,d.y+d.len*Math.max(0.3,intensity));
        ctx.strokeStyle='rgba(140,200,255,'+(d.op*intensity)+')';ctx.lineWidth=1.2;ctx.stroke();
        d.y+=d.speed*Math.max(0.3,intensity);
        if(d.y>80){d.y=-d.len;d.x=Math.random()*canvas.width;}
      });
      rainAF[rainKey]=requestAnimationFrame(frame);
    }
    rainAF[rainKey]=requestAnimationFrame(frame);
  }

  function setW(side){
    const val=document.getElementById('w'+side[0]).value;
    const sky=document.getElementById('sky-'+side);
    clearSky(side);
    setTimeout(function(){
      if(val==='sunny') animateSunrise(sky);
      else if(val==='cloudy') animateClouds(sky,false);
      else if(val==='rain') animateRain(sky);
    },500);
    weatherState[side]=val;
  }
  window.setW=setW;

  // ── green overlay ──────────────────────────────────────────
  function applyGreen(on){
    document.getElementById('app').style.background=on?'#06150d':'#0d1b3e';
    document.getElementById('div-mid').classList.toggle('green-div',on);
    document.getElementById('street').classList.toggle('green-street',on);
    ['right','left'].forEach(side=>{
      document.getElementById('sky-'+side).classList.toggle('green-sky',on);
      const bld=document.getElementById('bld-'+side);
      bld.classList.toggle('green-bld',on);
      bld.querySelectorAll('.floor').forEach(f=>f.classList.toggle('green-floor',on));
      bld.querySelectorAll('.win').forEach(w=>w.classList.toggle('green-win',on));
    });
  }

  // ── cars – two lanes, no collision ────────────────────────
  const CARCOLORS=['#c0392b','#2471a3','#1e8449','#7d6608','#6c3483','#aab7b8','#784212','#1a252f','#e67e22','#16a085'];
  const laneQ={R:[],L:[]};

  function spawnCar(){
    const street=document.getElementById('street');
    const goRight=Math.random()<0.5;
    const lane=goRight?'R':'L';
    // lane positions: goRight → bottom lane (above sidewalk ~22px), goLeft → upper lane (~38px)
    const bot=goRight?22:38;
    const col=CARCOLORS[Math.floor(Math.random()*CARCOLORS.length)];
    const car=document.createElement('div');
    car.style.cssText=`position:absolute;bottom:${bot}px;width:36px;height:14px;z-index:5;`;
    const body=document.createElement('div');
    body.style.cssText=`position:absolute;bottom:0;left:0;right:0;height:10px;background:${col};border-radius:2px 2px 1px 1px;`;
    const top=document.createElement('div');
    top.style.cssText=`position:absolute;bottom:8px;left:7px;right:7px;height:7px;background:${col};filter:brightness(0.72);border-radius:2px 2px 0 0;`;
    const wL=document.createElement('div');
    wL.style.cssText='position:absolute;bottom:-3px;left:4px;width:7px;height:7px;border-radius:50%;background:#0d1020;border:1px solid #2a2e4e;';
    const wR=document.createElement('div');
    wR.style.cssText='position:absolute;bottom:-3px;right:4px;width:7px;height:7px;border-radius:50%;background:#0d1020;border:1px solid #2a2e4e;';
    const lf=document.createElement('div');
    lf.style.cssText='position:absolute;bottom:3px;right:1px;width:4px;height:4px;border-radius:50%;background:#ffe8a0;box-shadow:0 0 5px 1px rgba(255,232,120,0.7);';
    const lb=document.createElement('div');
    lb.style.cssText='position:absolute;bottom:3px;left:1px;width:4px;height:4px;border-radius:50%;background:#cc2222;box-shadow:0 0 4px 1px rgba(200,30,30,0.6);';
    car.appendChild(body);car.appendChild(top);car.appendChild(wL);car.appendChild(wR);car.appendChild(lf);car.appendChild(lb);
    const sw=street.offsetWidth||660;
    let pos=goRight?-40:sw+6;
    car.style.left=pos+'px';
    if(!goRight)car.style.transform='scaleX(-1)';
    street.appendChild(car);
    laneQ[lane].push(car);
    const speed=1.3+Math.random()*1.4;
    let af;
    function move(){
      const idx=laneQ[lane].indexOf(car);
      if(idx>0){
        const ahead=laneQ[lane][idx-1];
        const ap=parseFloat(ahead.style.left);
        const gap=goRight?ap-pos:pos-ap;
        if(gap<46){pos+=goRight?0.5:-0.5;car.style.left=pos+'px';af=requestAnimationFrame(move);return;}
      }
      pos+=goRight?speed:-speed;
      car.style.left=pos+'px';
      if((goRight&&pos>sw+44)||(!goRight&&pos<-44)){
        const qi=laneQ[lane].indexOf(car);if(qi>-1)laneQ[lane].splice(qi,1);
        car.remove();cancelAnimationFrame(af);
      } else af=requestAnimationFrame(move);
    }
    af=requestAnimationFrame(move);
    setTimeout(spawnCar,3000+Math.random()*5000);
  }

  // ── people ─────────────────────────────────────────────────
  const SKIN=['#c68642','#f1c27d','#e8beac','#8d5524','#ffdbac'];
  const SHIRTS=['#2e86c1','#922b21','#1e8449','#7d6608','#6c3483','#aab7b8','#784212'];
  function spawnPerson(){
    const street=document.getElementById('street');
    const goRight=Math.random()<0.5;
    const skin=SKIN[Math.floor(Math.random()*SKIN.length)];
    const shirt=SHIRTS[Math.floor(Math.random()*SHIRTS.length)];
    const p=document.createElement('div');
    p.style.cssText='position:absolute;width:7px;z-index:90;';
    const head=document.createElement('div');
    head.style.cssText=`width:7px;height:7px;border-radius:50%;background:${skin};position:absolute;top:0;left:0;`;
    const body=document.createElement('div');
    const bh=8+Math.floor(Math.random()*3);
    body.style.cssText=`width:5px;height:${bh}px;background:${shirt};position:absolute;top:6px;left:1px;border-radius:1px;`;
    // legs
    const legL=document.createElement('div');
    legL.style.cssText=`width:2px;height:5px;background:${skin};position:absolute;top:${6+bh}px;left:1px;border-radius:1px;`;
    const legR=document.createElement('div');
    legR.style.cssText=`width:2px;height:5px;background:${skin};position:absolute;top:${6+bh}px;left:4px;border-radius:1px;`;
    p.appendChild(head);p.appendChild(body);p.appendChild(legL);p.appendChild(legR);
    const sw=street.offsetWidth||660;
    let pos=goRight?-10:sw+10;
    p.style.left=pos+'px';
    // people walk on sidewalk — bottom ~2px
    p.style.bottom='2px';
    if(!goRight)p.style.transform='scaleX(-1)';
    street.appendChild(p);
    const speed=0.5+Math.random()*0.5;
    let step=0,af;
    function walk(){
      pos+=goRight?speed:-speed;
      step++;
      p.style.left=pos+'px';
      // bob up/down
      const bob=Math.abs(Math.sin(step*0.3))*2;
      p.style.bottom=(2+bob)+'px';
      // leg swing
      const swing=Math.sin(step*0.3)*3;
      legL.style.transform=`rotate(${swing}deg)`;
      legR.style.transform=`rotate(${-swing}deg)`;
      if((goRight&&pos>sw+14)||(!goRight&&pos<-14)){p.remove();cancelAnimationFrame(af);}
      else af=requestAnimationFrame(walk);
    }
    af=requestAnimationFrame(walk);
    setTimeout(spawnPerson,2500+Math.random()*4500);
  }

  // ── hash & check ──────────────────────────────────────────
  async function hashit(d,m,w){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d+'|'+m+'|'+w));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const TR=hashit('sun','6','rain');
  const TL=hashit('wed','12','sunny');
  let rOk=false,lOk=false;

  async function chk(){
    const dr=document.getElementById('dr').value,mr=document.getElementById('mr').value,wr=document.getElementById('wr').value;
    const dl=document.getElementById('dl').value,ml=document.getElementById('ml').value,wl=document.getElementById('wl').value;
    const [hTR,hTL]=await Promise.all([TR,TL]);
    rOk=dr&&mr&&wr?(await hashit(dr,mr,wr))===hTR:false;
    lOk=dl&&ml&&wl?(await hashit(dl,ml,wl))===hTL:false;
    const both=rOk&&lOk;
    applyGreen(both);
    const dotR=document.getElementById('dot-r'),dotL=document.getElementById('dot-l');
    const banner=document.getElementById('banner');
    const controls=document.getElementById('controls');
    const sbar=document.getElementById('sbar');
    if(both){
      dotR.style.cssText='background:#22cc77;box-shadow:0 0 8px #22cc77;';
      dotL.style.cssText='background:#22cc77;box-shadow:0 0 8px #22cc77;';
      banner.classList.add('show');
      playTing();
      // Hide controls and statusbar
      controls.classList.add('hidden');
      sbar.classList.add('hidden');
    } else {
      dotR.style.cssText='background:#252a42;';dotL.style.cssText='background:#252a42;';
      banner.classList.remove('show');
      controls.classList.remove('hidden');
      sbar.classList.remove('hidden');
    }
  }
  window.chk=chk;

  // add sunGlow2 keyframe dynamically
  const styleEl=document.createElement('style');
  styleEl.textContent=`@keyframes sunGlow2{0%,100%{box-shadow:0 0 16px 5px rgba(255,208,60,0.45),0 0 36px 12px rgba(255,180,0,0.18)}50%{box-shadow:0 0 24px 9px rgba(255,208,60,0.6),0 0 55px 20px rgba(255,180,0,0.28)}}`;
  document.head.appendChild(styleEl);

  // ── intro ──────────────────────────────────────────────────
  function introAnim(){
    ['half-right','half-left'].forEach((id,i)=>{
      const el=document.getElementById(id);
      el.style.transition='opacity 0.9s '+(i*0.25)+'s';
      el.style.opacity='1';
    });
    setTimeout(()=>{
      document.getElementById('bld-right').style.transition='transform 1.1s cubic-bezier(0.34,1.4,0.64,1)';
      document.getElementById('bld-right').style.transform='scaleY(1)';
    },300);
    setTimeout(()=>{
      document.getElementById('bld-left').style.transition='transform 1.1s cubic-bezier(0.34,1.4,0.64,1)';
      document.getElementById('bld-left').style.transform='scaleY(1)';
    },500);
    const wins=[...document.querySelectorAll('.win')];
    wins.forEach((w,i)=>{const orig=w.className;w.className='win';setTimeout(()=>{w.className=orig;},700+i*20);});
    setTimeout(()=>{
      const ctrl=document.getElementById('controls'),sbar=document.getElementById('sbar');
      ctrl.style.transition='opacity 1s,transform 1s';
      sbar.style.transition='opacity 1s';
    },1600);
    setTimeout(spawnCar,1800+Math.random()*1500);
    setTimeout(spawnPerson,1200+Math.random()*1500);
    setTimeout(spawnPerson,3500+Math.random()*1500);
    setTimeout(spawnPerson,5500+Math.random()*2000);
  }
  setTimeout(introAnim,150);

  // ── audio ──────────────────────────────────────────────────
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  const ac=new AC();
  function noise(dur,freq,q,gain,when,type='bandpass'){
    const buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=ac.createBufferSource();src.buffer=buf;
    const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
    const g=ac.createGain();
    g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(gain,when+dur*0.2);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start(when);src.stop(when+dur);
  }
  function chirp(freqs,when){
    freqs.forEach((freq,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='sine';
      const t=when+i*0.12;
      o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.38,t+0.07);
      o.frequency.exponentialRampToValueAtValue(freq*1.06,t+0.14);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.018,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.start(t);o.stop(t+0.2);
    });
  }
  function playTing(){
    if(!ac)return;
    if(ac.state==='suspended')ac.resume();
    const now=ac.currentTime;
    // bright metallic ting: two sine tones with fast decay
    [[1047,0],[1319,0.04],[2093,0.08]].forEach(function(pair){
      const freq=pair[0],delay=pair[1];
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.type='sine';o.frequency.value=freq;
      g.gain.setValueAtTime(0,now+delay);
      g.gain.linearRampToValueAtTime(0.18,now+delay+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,now+delay+1.2);
      o.start(now+delay);o.stop(now+delay+1.3);
    });
  }

  function scheduleAmbience(){
    const n=ac.currentTime;
    noise(4,220,0.35,0.04,n);noise(3,380,0.25,0.025,n+0.5);
    const wr=document.getElementById('wr').value,wl=document.getElementById('wl').value;
    if(wr==='rain'||wl==='rain'){noise(4,1200,0.3,0.06,n);noise(4,600,0.25,0.04,n);noise(3.5,2400,0.2,0.03,n+0.2);}
    if(Math.random()<0.55){noise(2.2,320,1.2,0.045,n+1+Math.random()*2);noise(1.8,160,0.8,0.03,n+1.1+Math.random()*2);}
    if(Math.random()<0.35){for(let i=0;i<4+Math.floor(Math.random()*3);i++){const t=n+0.5+i*0.55;noise(0.1,700,9,0.025,t);noise(0.08,350,6,0.018,t+0.05);}}
    if(Math.random()<0.4)chirp([880,1100,950,1280],n+Math.random()*2);
    setTimeout(scheduleAmbience,5000+Math.random()*7000);
  }
  function startAudio(){
    if(ac.state==='suspended')ac.resume();
    setTimeout(scheduleAmbience,300);
    document.removeEventListener('click',startAudio);document.removeEventListener('touchstart',startAudio);
  }
  if(ac.state==='running')setTimeout(scheduleAmbience,800);
  else{document.addEventListener('click',startAudio);document.addEventListener('touchstart',startAudio);}
})();
</script>
